name: Publish

# Publishes @promptster/setup to npm when package.json's version is not there yet.
# `npx @promptster/setup --token …` is the enrollment command the Promptster
# console hands every engineer, so a stale package is the first thing a new
# engineer hits. Bumping the version and merging is the whole release.
#
# Auth: npm trusted publishing (OIDC). npmjs.com trusts this repo's
# publish.yml, so there is no token to store or rotate. Needs npm >= 11.5.1,
# hence Node 24. A provenance attestation is attached automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish if version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # Skip only on a confirmed match; an inconclusive lookup still publishes
          # and npm's own duplicate rejection is treated as success.
          EXISTING=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
          if [ "${EXISTING}" = "${VERSION}" ]; then
            echo "${NAME}@${VERSION} already published — skipping."
            exit 0
          fi
          if npm publish --access public 2>publish.err; then
            echo "Published ${NAME}@${VERSION}."
          elif grep -qiE "cannot publish over|already exists|409" publish.err; then
            echo "${NAME}@${VERSION} already exists — treating as success."
          else
            cat publish.err >&2
            exit 1
          fi
